name: Bug report
description: Something behaved incorrectly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report a security vulnerability here — see
        [SECURITY.md](https://github.com/next-citizen-llc/agent-bridge/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command
      description: The `agent ...` invocation, with any prompt text redacted.
      render: shell
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Output
      description: >
        The bounded error. Please redact tokens, absolute paths you would rather
        not publish, and anything from a private repository.
      render: text
    validations:
      required: true

  - type: input
    id: failure-class
    attributes:
      label: Failure class (optional)
      description: >
        If you can place it in the taxonomy — target resolution, authentication,
        network, project context, authority, dispatch, model execution,
        verification, handoff, state recording — say which.

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0, or the commit SHA
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Platform
      options: [macOS, Linux, Windows]
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.11.15"
    validations:
      required: true

  - type: input
    id: target
    attributes:
      label: Target agent
      description: Which configured target was dispatched to, if any.
      placeholder: claude, codex, grok, agy
