name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Cover every version `requires-python` claims. Both ends run on both
      # platforms; the interior versions run on Linux only, where a job is
      # roughly four times cheaper.
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: ubuntu-latest, python: "3.14" }
          - { os: macos-latest, python: "3.11" }
          - { os: macos-latest, python: "3.14" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m py_compile agent_bridge/*.py
      - run: python -m unittest discover -s tests

  quality:
    name: Lint and incremental state-sync type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install --require-hashes --requirement requirements-quality.txt
      - run: python -m ruff check agent_bridge tests
      - name: Mypy (incremental; state_sync.py only)
        run: python -m mypy

  package:
    name: Package metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade build twine
      # Nothing else in CI builds the distribution, so a broken pyproject would
      # otherwise only surface at release time.
      - run: python -m build
      - run: python -m twine check dist/*

  windows-installer:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install, invoke, and uninstall in an isolated home
        shell: pwsh
        run: |
          $testHome = Join-Path $env:RUNNER_TEMP "agent-bridge-home"
          $binDir = Join-Path $testHome ".local\bin"
          New-Item -ItemType Directory -Force -Path $testHome | Out-Null
          $env:HOME = $testHome

          .\scripts\install.ps1 -ProjectDir $PWD.Path -BinDir $binDir
          if (-not (Test-Path (Join-Path $binDir "agent.cmd"))) {
              throw "agent.cmd was not installed"
          }

          $agents = & (Join-Path $binDir "agent.cmd") code bridge --list
          $agentExitCode = $LASTEXITCODE
          $agentOutput = $agents -join "`n"
          if ($agentExitCode -ne 0 -or $agentOutput -notmatch "codex") {
              throw "installed launcher did not list configured adapters"
          }

          .\scripts\uninstall.ps1 -ProjectDir $PWD.Path -BinDir $binDir
          if (Test-Path (Join-Path $binDir "agent.cmd")) {
              throw "agent.cmd was not removed"
          }
