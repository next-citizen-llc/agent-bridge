<svg xmlns="http://www.w3.org/2000/svg" style="background:#ffffff" viewBox="0 0 460 420" role="img" aria-label="The classic Eisenhower box: four quadrants over urgency and importance — Do, Schedule, Delegate, Eliminate">
  <style>text{font-family:'IBM Plex Mono',monospace}</style>
  <line x1="60" y1="20" x2="60" y2="360" stroke="#3d444d" stroke-width="1.5"/>
  <line x1="60" y1="360" x2="440" y2="360" stroke="#3d444d" stroke-width="1.5"/>
  <polygon points="60,20 55,30 65,30" fill="#3d444d"/>
  <polygon points="440,360 430,355 430,365" fill="#3d444d"/>
  <text x="30" y="200" font-size="11" fill="#3d444d" transform="rotate(-90 30 200)" text-anchor="middle">IMPORTANCE →</text>
  <text x="250" y="392" font-size="11" fill="#3d444d" text-anchor="middle">URGENCY →</text>
  <rect x="252" y="28" width="180" height="160" fill="#F6E4E4" stroke="#B33A3A" stroke-width="1.5"/>
  <text x="342" y="98" font-size="15" font-weight="600" fill="#B33A3A" text-anchor="middle">DO FIRST</text>
  <text x="342" y="118" font-size="10" fill="#3d444d" text-anchor="middle">urgent + important</text>
  <rect x="66" y="28" width="180" height="160" fill="#E2EFe7" stroke="#2E6B45" stroke-width="1.5"/>
  <text x="156" y="98" font-size="15" font-weight="600" fill="#2E6B45" text-anchor="middle">SCHEDULE</text>
  <text x="156" y="118" font-size="10" fill="#3d444d" text-anchor="middle">important, not urgent</text>
  <rect x="252" y="194" width="180" height="160" fill="#E3EAF7" stroke="#3A5FA8" stroke-width="1.5"/>
  <text x="342" y="264" font-size="15" font-weight="600" fill="#3A5FA8" text-anchor="middle">DELEGATE</text>
  <text x="342" y="284" font-size="10" fill="#3d444d" text-anchor="middle">urgent, not important</text>
  <rect x="66" y="194" width="180" height="160" fill="#EBE7F3" stroke="#6B5E8E" stroke-width="1.5"/>
  <text x="156" y="264" font-size="15" font-weight="600" fill="#6B5E8E" text-anchor="middle">ELIMINATE</text>
  <text x="156" y="284" font-size="10" fill="#3d444d" text-anchor="middle">neither</text>
</svg>