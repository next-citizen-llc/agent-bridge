[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-bridge"
version = "0.1.0"
description = "Global local bridge for bounded headless collaboration between coding agents."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tristan Springmeyer" }]
keywords = ["agents", "cli", "mcp", "local-first", "developer-tools", "code-review"]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/next-citizen-llc/agent-bridge"
Repository = "https://github.com/next-citizen-llc/agent-bridge"
Issues = "https://github.com/next-citizen-llc/agent-bridge/issues"
Changelog = "https://github.com/next-citizen-llc/agent-bridge/releases"

[project.scripts]
agent = "agent_bridge.cli:main_entry"

[tool.setuptools]
packages = ["agent_bridge"]
include-package-data = true

[tool.setuptools.package-data]
agent_bridge = ["agents.json", "surfaces.json", "readiness_schema.json", "workflows/*.json"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Keep this a correctness gate. Broad exception handling is deliberate in several
# best-effort/stdio boundaries and should be reviewed case-by-case, not banned
# or autofixed wholesale.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
# Deliberately incremental: this is not yet a repository-wide type-safety claim.
files = ["agent_bridge/state_sync.py"]
follow_imports = "skip"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
